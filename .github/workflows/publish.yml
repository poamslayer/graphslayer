# Publishes to npm over OIDC trusted publishing when a GitHub release is published.
# No token secret: npm detects the OIDC token on its own and adds provenance for a public repo.
# On npmjs.com, the package's trusted publisher must name this file: publish.yml.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write   # required for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # GitHub-hosted only; self-hosted runners are not supported
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'                     # ships npm 11, which trusted publishing needs
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false           # no cache in a release build
      # The keychain libraries load libsecret when imported, and prepublishOnly's tests store
      # secrets through a Secret Service on D-Bus, which a runner does not have until one is started.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11
      - run: npm ci
      # prepublishOnly cleans, builds and tests before anything is uploaded
      - run: dbus-run-session -- sh -c 'echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm publish'
